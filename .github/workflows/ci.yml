name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · vet, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      - name: build binaries
        run: |
          go build -trimpath -o /tmp/anyquery ./cmd/server
          go build -trimpath -o /tmp/anyquery-seed ./cmd/seed

  frontend:
    name: Frontend · typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - name: upload SPA
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: E2E · MongoDB + SQLite federation
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      influxdb:
        image: influxdb:1.8
        env:
          INFLUXDB_DB: metrics
        ports:
          - 8086:8086
        options: >-
          --health-cmd "influx -execute 'SHOW DATABASES'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anyquery
          POSTGRES_PASSWORD: anyquery_test
          POSTGRES_DB: anyquery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anyquery -d anyquery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: anyquery_ci
      APP_BASE_URL: http://localhost:8080
      PORT: "8080"
      AUTH_DEV_MODE: "true"
      QUERY_TIMEOUT_SECONDS: "30"
      MAX_SAVED_QUERIES: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: wait for services
        run: |
          for port in 27017 6379 5432 8086; do
            for i in $(seq 1 30); do
              if (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
          done
          sleep 2
      - name: build
        working-directory: backend
        run: |
          go build -trimpath -o /tmp/anyquery ./cmd/server
          go build -trimpath -o /tmp/anyquery-seed ./cmd/seed
      - name: seed demo workspace
        working-directory: backend
        run: /tmp/anyquery-seed
      - name: start API
        working-directory: backend
        run: |
          /tmp/anyquery > /tmp/anyquery-server.log 2>&1 &
          echo $! > /tmp/anyquery.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/anyquery-server.log
          exit 1
      - name: login
        run: |
          curl -fsS -c /tmp/cookies -X POST http://localhost:8080/api/v1/auth/dev-login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@anyquery.dev"}'
      - name: Password login
        run: |
          curl -fsS -c /tmp/pw-cookies -X POST http://localhost:8080/api/v1/auth/password-login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@anyquery.dev","password":"anyquery-demo"}' > /tmp/pw-login.json
          curl -fsS -b /tmp/pw-cookies http://localhost:8080/api/v1/auth/me > /tmp/pw-me.json
          python3 - <<'PY'
          import json
          login = json.load(open("/tmp/pw-login.json"))
          me = json.load(open("/tmp/pw-me.json"))
          assert login["user"]["email"] == "admin@anyquery.dev", login
          assert me["authType"] == "session", me
          print("password login verified:", login["user"]["email"])
          PY

      - name: federated JOIN query
        run: |
          cat > /tmp/query.json <<'JSON'
          {"sql":"SELECT p.category, count(*) AS orders, round(sum(o.total), 2) AS revenue FROM mongo.orders o JOIN shop.products p ON o.product_id = p.id WHERE o.status = 'paid' GROUP BY p.category ORDER BY revenue DESC"}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/queries/execute \
            -H 'Content-Type: application/json' --data-binary @/tmp/query.json > /tmp/result.json
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/result.json"))
          assert "error" not in result, result
          rows = result["result"]["rows"]
          assert len(rows) == 6, rows
          assert rows[0]["category"] == "Data Engineering", rows[0]
          assert rows[0]["revenue"] == 17180, rows[0]
          assert rows[0]["orders"] == 8, rows[0]
          print("federated result:", rows[0])
          PY
      - name: pipeline query
        run: |
          cat > /tmp/pipeline.json <<'JSON'
          {"sql":"FROM mongo.orders |> WHERE status = 'paid' |> AGGREGATE region, count(*) AS orders, round(sum(total), 2) AS revenue GROUP BY region |> ORDER BY revenue DESC"}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/queries/execute \
            -H 'Content-Type: application/json' --data-binary @/tmp/pipeline.json > /tmp/pipeline-result.json
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/pipeline-result.json"))
          assert "error" not in result, result
          rows = result["result"]["rows"]
          assert len(rows) == 3, rows
          assert rows[0]["region"] == "NA", rows[0]
          print("pipeline result:", rows[0])
          PY
      - name: advanced SQL (CTE + window + set ops + subquery)
        run: |
          execute() {
            curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/queries/execute \
              -H 'Content-Type: application/json' --data-binary "$1"
          }
          execute '{"sql":"WITH totals AS (SELECT region, count(*) AS n FROM mongo.orders WHERE status = '"'"'paid'"'"' GROUP BY region) SELECT region, n, row_number() OVER (ORDER BY n DESC, region) AS rn FROM totals ORDER BY rn"}' > /tmp/sql-window.json
          execute '{"sql":"SELECT region FROM mongo.orders WHERE status = '"'"'paid'"'"' UNION SELECT region FROM mongo.orders WHERE status = '"'"'refunded'"'"' ORDER BY region"}' > /tmp/sql-union.json
          execute '{"sql":"SELECT c.name, (SELECT count(*) FROM mongo.orders o WHERE o.customer_id = c.id) AS orders FROM mongo.customers c ORDER BY c.name LIMIT 3"}' > /tmp/sql-subquery.json
          execute '{"sql":"WITH RECURSIVE nums(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM nums WHERE n < 5) SELECT count(*) AS n FROM nums"}' > /tmp/sql-recursive.json
          execute '{"sql":"SELECT ? AS a, $2 AS b","params":[7,"ok"]}' > /tmp/sql-params.json
          execute '{"sql":"SELECT region, count(*) AS n, grouping(region) AS g FROM mongo.orders WHERE status = '"'"'paid'"'"' GROUP BY ROLLUP(region) ORDER BY g, region"}' > /tmp/sql-rollup.json
          python3 - <<'PY2'
          import json
          window = json.load(open("/tmp/sql-window.json"))
          assert "error" not in window, window
          rows = window["result"]["rows"]
          assert rows and rows[0]["rn"] == 1, rows
          union = json.load(open("/tmp/sql-union.json"))
          assert "error" not in union, union
          regions = [r["region"] for r in union["result"]["rows"]]
          assert len(regions) == len(set(regions)) and "NA" in regions, regions
          sub = json.load(open("/tmp/sql-subquery.json"))
          assert "error" not in sub, sub
          assert len(sub["result"]["rows"]) == 3, sub["result"]["rows"]
          assert all(isinstance(r["orders"], int) for r in sub["result"]["rows"]), sub["result"]["rows"]
          recursive = json.load(open("/tmp/sql-recursive.json"))
          assert "error" not in recursive, recursive
          assert recursive["result"]["rows"][0]["n"] == 5, recursive
          params = json.load(open("/tmp/sql-params.json"))
          assert params["result"]["rows"][0] == {"a": 7, "b": "ok"}, params
          rollup = json.load(open("/tmp/sql-rollup.json"))["result"]["rows"]
          assert rollup[-1]["g"] == 1 and rollup[-1]["region"] is None, rollup
          print("advanced SQL verified:", rows[0], regions, sub["result"]["rows"][0], recursive["result"]["rows"][0], params["result"]["rows"][0])
          PY2

      - name: API key authentication
        run: |
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/apikeys \
            -H 'Content-Type: application/json' -d '{"name":"ci"}' > /tmp/key.json
          KEY=$(python3 -c 'import json; print(json.load(open("/tmp/key.json"))["key"])')
          curl -fsS -X POST http://localhost:8080/api/v1/tenants/acme/queries/execute \
            -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"sql":"SELECT 1 AS ok"}' > /tmp/key-result.json
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/key-result.json"))
          assert result["result"]["rows"] == [{"ok": 1}], result
          print("api key result:", result["result"]["rows"])
          PY
      - name: PAT scopes and MCP
        run: |
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/apikeys \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci-mcp","scopes":["catalog:read","query:execute"]}' > /tmp/mcp-key.json
          KEY=$(python3 -c 'import json; print(json.load(open("/tmp/mcp-key.json"))["key"])')
          curl -fsS -X POST http://localhost:8080/mcp -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26"}}' > /tmp/mcp-init.json
          curl -fsS -X POST http://localhost:8080/mcp -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' > /tmp/mcp-tools.json
          curl -fsS -X POST http://localhost:8080/mcp -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"execute_sql","arguments":{"sql":"SELECT count(*) AS n FROM `mongo`.`orders`"}}}' > /tmp/mcp-call.json
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/apikeys \
            -H 'Content-Type: application/json' -d '{"name":"ci-catalog-only","scopes":["catalog:read"]}' > /tmp/restricted-key.json
          RKEY=$(python3 -c 'import json; print(json.load(open("/tmp/restricted-key.json"))["key"])')
          status=$(curl -s -o /tmp/restricted-exec.json -w '%{http_code}' -X POST http://localhost:8080/api/v1/tenants/acme/queries/execute \
            -H "Authorization: Bearer $RKEY" -H 'Content-Type: application/json' -d '{"sql":"SELECT 1"}')
          python3 - <<'PY2'
          import json
          init = json.load(open("/tmp/mcp-init.json"))
          assert init["result"]["serverInfo"]["name"] == "AnyQuery", init
          tools = [t["name"] for t in json.load(open("/tmp/mcp-tools.json"))["result"]["tools"]]
          assert tools == ["get_catalog", "execute_sql"], tools
          call = json.load(open("/tmp/mcp-call.json"))
          text = call["result"]["content"][0]["text"]
          assert '"n":36' in text or '"n": 36' in text, text
          restricted = json.load(open("/tmp/restricted-exec.json"))
          assert restricted["error"]["code"] == "scope_required", restricted
          print("MCP + PAT scopes verified:", tools)
          PY2
          test "$status" = "403"

      - name: PAT plan scope and MCP explain
        run: |
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/apikeys \
            -H 'Content-Type: application/json' -d '{"name":"ci-plan","scopes":["query:plan"]}' > /tmp/plan-key.json
          PKEY=$(python3 -c 'import json; print(json.load(open("/tmp/plan-key.json"))["key"])')
          curl -fsS -X POST http://localhost:8080/mcp -H "Authorization: Bearer $PKEY" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' > /tmp/mcp-plan-tools.json
          curl -fsS -X POST http://localhost:8080/mcp -H "Authorization: Bearer $PKEY" -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"explain_sql","arguments":{"sql":"SELECT region, count(*) FROM `mongo`.`orders` GROUP BY region"}}}' > /tmp/mcp-plan.json
          python3 - <<'PY'
          import json
          tools = [t["name"] for t in json.load(open("/tmp/mcp-plan-tools.json"))["result"]["tools"]]
          assert tools == ["explain_sql"], tools
          plan = json.load(open("/tmp/mcp-plan.json"))["result"]["content"][0]["text"]
          assert "Source Scan" in plan and "Aggregate" in plan, plan
          print("MCP plan scope verified:", tools)
          PY

      - name: Redis connector + Mongo↔Redis join
        run: |
          python3 - <<'PY'
          import socket
          s = socket.create_connection(("127.0.0.1", 6379))
          def cmd(*args):
              payload = ("*%d\r\n" % len(args)).encode()
              for arg in args:
                  b = str(arg).encode()
                  payload += b"$%d\r\n" % len(b) + b + b"\r\n"
              s.sendall(payload)
              return s.recv(4096)
          cmd("HSET", "user:1", "name", "Maya", "role", "owner", "user_id", "1")
          cmd("HSET", "user:2", "name", "Sam", "role", "member", "user_id", "2")
          cmd("SET", "config:theme", "dark")
          cmd("CLOSE")
          PY
          cat > /tmp/redis-ds.json <<'JSON'
          {"name":"cache","type":"redis","config":{"url":"redis://127.0.0.1:6379/0","table_name":"keys","key_pattern":"user:*","scan_limit":"100"}}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/datasources             -H 'Content-Type: application/json' --data-binary @/tmp/redis-ds.json > /tmp/redis-ds-result.json
          cat > /tmp/redis-query.json <<'JSON'
          {"sql":"SELECT c.name, r.role FROM mongo.customers c JOIN cache.keys r ON c.id = r.user_id WHERE r._type = 'hash' ORDER BY c.name"}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/queries/execute             -H 'Content-Type: application/json' --data-binary @/tmp/redis-query.json > /tmp/redis-result.json
          python3 - <<'PY'
          import json
          ds = json.load(open("/tmp/redis-ds-result.json"))
          assert ds.get("status") == "ready", ds
          assert ds["tables"][0]["name"] == "keys", ds
          cols = {c["name"] for c in ds["tables"][0]["columns"]}
          assert {"_key", "_type", "_ttl", "_size", "_value", "name", "role", "user_id"} <= cols, cols
          result = json.load(open("/tmp/redis-result.json"))
          assert "error" not in result, result
          rows = result["result"]["rows"]
          assert rows == [{"name": "Acme Corp", "role": "owner"}, {"name": "Globex", "role": "member"}], rows
          print("redis join result:", rows)
          PY

      - name: JSONL connector
        run: |
          mkdir -p /tmp/aq-jsonl
          cat > /tmp/aq-jsonl/events.jsonl <<'JSONL'
          {"event":"signup","user_id":1,"amount":0}
          {"event":"purchase","user_id":1,"amount":49.5}
          {"event":"purchase","user_id":2,"amount":120}
          JSONL
          python3 -m http.server 18999 --directory /tmp/aq-jsonl >/tmp/jsonl-http.log 2>&1 &
          echo $! > /tmp/jsonl-http.pid
          sleep 1
          cat > /tmp/jsonl-ds.json <<'JSON'
          {"name":"events","type":"jsonl","config":{"url":"http://127.0.0.1:18999/events.jsonl","table_name":"events"}}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/datasources             -H 'Content-Type: application/json' --data-binary @/tmp/jsonl-ds.json > /tmp/jsonl-ds-result.json
          cat > /tmp/jsonl-query.json <<'JSON'
          {"sql":"SELECT c.name, count(*) AS events, sum(e.amount) AS total FROM events.events e JOIN mongo.customers c ON e.user_id = c.id WHERE e.event = 'purchase' GROUP BY c.name ORDER BY total DESC"}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/queries/execute             -H 'Content-Type: application/json' --data-binary @/tmp/jsonl-query.json > /tmp/jsonl-result.json
          python3 - <<'PY'
          import json
          ds = json.load(open("/tmp/jsonl-ds-result.json"))
          assert ds.get("status") == "ready", ds
          assert len(ds["tables"][0]["columns"]) >= 3, ds
          result = json.load(open("/tmp/jsonl-result.json"))
          assert "error" not in result, result
          rows = result["result"]["rows"]
          assert [r["name"] for r in rows] == ["Globex", "Acme Corp"], rows
          assert rows[0]["total"] == 120, rows
          print("jsonl join result:", rows)
          PY

      - name: PostgreSQL connector + Mongo↔Postgres join
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=anyquery_test psql -h 127.0.0.1 -U anyquery -d anyquery_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.sales (
            id serial PRIMARY KEY,
            region text NOT NULL,
            product text NOT NULL,
            amount numeric(12,2) NOT NULL,
            sold_at timestamptz NOT NULL DEFAULT now()
          );
          TRUNCATE public.sales;
          INSERT INTO public.sales (region, product, amount, sold_at) VALUES
           ('NA','Atlas Analytics', 499.00, '2026-10-01T10:00:00Z'),
           ('NA','Pulse BI', 199.00, '2026-10-02T11:00:00Z'),
           ('EU','Orbit CRM', 299.00, '2026-10-03T12:00:00Z'),
           ('EU','Forge ETL', 799.00, '2026-10-04T13:00:00Z'),
           ('APAC','Prism Warehouse', 899.00, '2026-10-05T14:00:00Z');
          SQL
          cat > /tmp/pg-ds.json <<'JSON'
          {"name":"pg","type":"postgres","config":{"host":"127.0.0.1","port":"5432","database":"anyquery_test","username":"anyquery","password":"anyquery_test","sslmode":"disable"}}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/datasources             -H 'Content-Type: application/json' --data-binary @/tmp/pg-ds.json > /tmp/pg-ds-result.json
          python3 - <<'PY'
          import json
          ds = json.load(open("/tmp/pg-ds-result.json"))
          assert ds.get("status") == "ready", ds
          tables = {t["name"]: {c["name"] for c in t["columns"]} for t in ds["tables"]}
          assert "public.sales" in tables, tables
          assert {"id", "region", "product", "amount", "sold_at"} <= tables["public.sales"], tables
          print("postgres schema:", tables)
          PY
          cat > /tmp/pg-query.json <<'JSON'
          {"sql":"SELECT s.region, count(*) AS n, round(sum(s.amount), 2) AS total FROM pg.`public.sales` s JOIN mongo.orders o ON o.region = s.region WHERE o.status = 'paid' GROUP BY s.region ORDER BY total DESC"}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/queries/execute             -H 'Content-Type: application/json' --data-binary @/tmp/pg-query.json > /tmp/pg-result.json
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/pg-result.json"))
          assert "error" not in result, result
          rows = result["result"]["rows"]
          assert len(rows) == 3, rows
          assert rows[0] == {"region": "NA", "n": 30, "total": 10470}, rows[0]
          print("postgres join result:", rows[0])
          PY

      - name: InfluxDB connector
        run: |
          curl -fsS -XPOST "http://127.0.0.1:8086/write?db=metrics" --data-binary $'cpu,host=node1 usage=0.5,count=3i\ncpu,host=node2 usage=0.8,count=5i'
          cat > /tmp/influx-ds.json <<'JSON'
          {"name":"metrics","type":"influxdb","config":{"url":"http://127.0.0.1:8086","database":"metrics","auth_mode":"basic","lookback_minutes":"60"}}
          JSON
          cat > /tmp/influx-test-req.json <<'JSON'
          {"type":"influxdb","config":{"url":"http://127.0.0.1:8086","database":"metrics","auth_mode":"basic","lookback_minutes":"60"}}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/datasources/test \
            -H 'Content-Type: application/json' --data-binary @/tmp/influx-test-req.json > /tmp/influx-test.json
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/datasources \
            -H 'Content-Type: application/json' --data-binary @/tmp/influx-ds.json > /tmp/influx-ds-result.json
          cat > /tmp/influx-query.json <<'JSON'
          {"sql":"SELECT host, usage, count FROM metrics.cpu ORDER BY host"}
          JSON
          curl -fsS -b /tmp/cookies -X POST http://localhost:8080/api/v1/tenants/acme/queries/execute \
            -H 'Content-Type: application/json' --data-binary @/tmp/influx-query.json > /tmp/influx-result.json
          python3 - <<'PY'
          import json
          test = json.load(open("/tmp/influx-test.json"))
          assert test.get("ok") is True, test
          ds = json.load(open("/tmp/influx-ds-result.json"))
          assert ds.get("status") == "ready", ds
          tables = {t["name"]: {c["name"]: c["type"] for c in t["columns"]} for t in ds["tables"]}
          assert "cpu" in tables, tables
          assert tables["cpu"].get("host") == "string", tables
          assert tables["cpu"].get("usage") == "number", tables
          result = json.load(open("/tmp/influx-result.json"))
          assert "error" not in result, result
          rows = result["result"]["rows"]
          assert len(rows) == 2, rows
          assert rows[0] == {"host": "node1", "usage": 0.5, "count": 3}, rows
          print("influx result:", rows)
          PY

      - name: Saved query library top-100 limit
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import json
          import urllib.error
          import urllib.request

          base = "http://localhost:8080/api/v1"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))

          def call(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(base + path, data=data, method=method,
                                           headers={"Content-Type": "application/json"})
              try:
                  res = opener.open(req)
                  return res.status, json.load(res)
              except urllib.error.HTTPError as exc:
                  return exc.code, json.load(exc)

          status, _ = call("POST", "/auth/dev-login", {"email": "admin@anyquery.dev"})
          assert status == 200, status
          info = json.load(opener.open(base + "/tenants/acme"))
          assert info["limits"]["maxSavedQueries"] == 10, info
          existing = json.load(opener.open(base + "/tenants/acme/queries"))["queries"]
          assert info["usage"]["savedQueries"] == len(existing), (info, len(existing))
          for i in range(len(existing), 10):
              status, body = call("POST", "/tenants/acme/queries", {
                  "name": f"ci-limit-{i}", "sql": "SELECT 1", "visibility": "team",
              })
              assert status == 201, (i, status, body)
          status, body = call("POST", "/tenants/acme/queries", {
              "name": "ci-limit-overflow", "sql": "SELECT 1", "visibility": "team",
          })
          assert status == 409, (status, body)
          assert body["error"]["code"] == "saved_query_limit", body
          info = json.load(opener.open(base + "/tenants/acme"))
          assert info["usage"]["savedQueries"] == 10, info
          print("saved query limit verified:", info["usage"], info["limits"])
          PY

      - name: server log
        if: failure()
        run: cat /tmp/anyquery-server.log || true

  docker:
    name: Docker · production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: anyquery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
